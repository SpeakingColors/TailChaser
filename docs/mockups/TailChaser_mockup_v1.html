:root{--w:1360px;--h:800px}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:#070708;font-family:'Barlow Condensed',sans-serif;color:var(--tx)}
body[data-theme=b]{--bg:#0b0b0d;--pn:#15161a;--pn2:#1c1d22;--ln:#2b2d34;--dp:#06080a;--tx:#f4f5f7;--dim:#a9adb8;--ttl:#E1CBF4;--mint:#02EBBA;--pink:#FF1383;--pur:#A43DFF;--yel:#FFD100;--sky:#6CC9F5;--amb:#FFA600;--sel:#241238;--selb:#CD92FE;--grid:#1b2523}
body[data-theme=a]{--bg:#161638;--pn:#1c1c4a;--pn2:#2C2C62;--ln:#33403f;--dp:#05060d;--tx:#e8e6e1;--dim:#b8b4d8;--ttl:#c7c9ff;--mint:#02EBBA;--pink:#FF1383;--pur:#A43DFF;--yel:#FFD100;--sky:#6CC9F5;--amb:#FFA600;--sel:#3a2a5a;--selb:#FFA600;--grid:#232a48}
body[data-theme=c]{--bg:#121214;--pn:#202023;--pn2:#2a2a2e;--ln:#3a3a40;--dp:#0a0a0b;--tx:#ffffff;--dim:#c4c4cc;--ttl:#ffffff;--mint:#02EBBA;--pink:#FF1383;--pur:#A43DFF;--yel:#FFD100;--sky:#6CC9F5;--amb:#FFA600;--sel:#33333a;--selb:#ffffff;--grid:#26262b}
#vp{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform-origin:50% 50%;background:var(--bg);display:flex;box-shadow:0 0 40px #000}
.cheek{width:44px;flex:none;position:relative;cursor:default}
.cheek canvas{position:absolute;inset:0;width:100%;height:100%}
#main{flex:1;display:flex;flex-direction:column;padding:8px 10px 6px;gap:8px;min-width:0}
header{display:flex;align-items:center;gap:10px;height:42px}
.logo{width:36px;height:34px;flex:none}
.name{font-weight:700;font-size:26px;letter-spacing:.5px;color:var(--ttl)}
.brand{font-size:15px;color:var(--sky);font-weight:600;margin-left:-4px;margin-top:6px}
.sp{flex:1}
button,select{font:600 15px 'Barlow Condensed',sans-serif;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:4px 10px;cursor:pointer;height:28px}
button:hover,select:hover{border-color:var(--selb)}
button.on{background:var(--sel);border-color:var(--selb);color:var(--ttl)}
button.mint{border-color:var(--mint);color:var(--mint)}
button.dis{opacity:.4;pointer-events:none}
.pre{display:flex;gap:4px;align-items:center}
.pre select{min-width:170px}
#body{flex:1;display:flex;gap:10px;min-height:0}
#left{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 8px}
.card h3{margin:0 0 2px;font-size:15px;color:var(--ttl);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
#disp{position:relative;padding:4px}
#cv{display:block;width:100%;height:440px;background:var(--dp);border-radius:5px;cursor:crosshair}
#chips{display:flex;gap:8px;margin-top:4px;align-items:center}
.chip{background:var(--dp);border:1px solid var(--ln);border-radius:5px;padding:1px 8px;font:500 13px 'JetBrains Mono',monospace;white-space:nowrap;color:var(--dim)}
.chip b{color:var(--yel);font-weight:500}
#ctl{display:flex;gap:8px}
.grp{display:flex;flex-direction:column}
.row{display:flex;gap:2px}
.knob{width:60px;display:flex;flex-direction:column;align-items:center;cursor:ns-resize}
.knob svg{width:46px;height:46px}
.knob .l{font-size:14px;font-weight:600;color:var(--sky);line-height:14px;margin-top:-2px;text-align:center}
.knob .v{font:500 12px 'JetBrains Mono',monospace;color:var(--yel);background:var(--dp);border:1px solid var(--ln);border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap}
.knob.off{opacity:.35}
.seg{display:flex;flex-direction:column;align-items:center;width:112px}
.seg .l{font-size:14px;font-weight:600;color:var(--sky)}
.seg .b{display:flex;margin-top:6px}
.seg button{border-radius:0;padding:4px 9px;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
#meters{width:150px;display:flex;flex-direction:column}
#meters .mrow{display:flex;gap:6px;flex:1;justify-content:center}
.mcol{display:flex;flex-direction:column;align-items:center}
.mcol .t{font-size:14px;font-weight:700;color:var(--ttl)}
.mcol canvas{background:var(--dp);border-radius:4px}
.mcol .pk{font:500 11px 'JetBrains Mono',monospace;color:var(--yel);height:14px}
#rig{display:flex;align-items:center;gap:8px;border:1px dashed var(--ln);border-radius:8px;padding:4px 8px;background:transparent}
#rig .tag{font-size:13px;color:var(--amb);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
#foot{display:flex;justify-content:space-between;font:500 11px 'JetBrains Mono',monospace;color:var(--dim);height:14px}
.h{position:absolute;z-index:5}
#tip{position:fixed;z-index:50;max-width:300px;background:#000;border:1px solid var(--selb,#CD92FE);color:#f4f5f7;font:500 15px 'Barlow Condensed',sans-serif;padding:5px 9px;border-radius:6px;pointer-events:none;display:none}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
#dlg{background:var(--pn);border:1px solid var(--selb);border-radius:10px;padding:14px 16px;min-width:420px;max-width:760px;max-height:90%;overflow:auto;font-size:17px}
#dlg h2{margin:0 0 8px;color:var(--ttl);font-size:24px}
#dlg p,#dlg li{margin:4px 0;color:var(--tx);line-height:1.15}
#dlg input[type=text],#dlg textarea{width:100%;background:var(--dp);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:5px 8px;font:500 14px 'JetBrains Mono',monospace}
#dlg textarea{height:160px}
#dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#dlg label{display:flex;align-items:center;gap:8px;margin:6px 0}
#dlg kbd{background:var(--dp);border:1px solid var(--ln);border-radius:4px;padding:0 6px;font:500 13px 'JetBrains Mono',monospace;color:var(--yel)}
</style></head>

<script>
/* Tail Chaser core: finds reverb and delay tails (and quiet leftovers) and
   turns them down. Plain JS so the mockup and the tests run the same code;
   the C++ port in the plugin must match it (parity test planned).
   Design: split into bands, follow each band's level (10 ms window, 1 ms hop),
   find hits, find where each hit's decay becomes a tail, fade it out, and open
   again just before the next hit (the whole file is known in Scan mode, so
   the gain can open early). All gains are written as one dB value per hop and
   linearly interpolated per sample, so there are no jumps.
   Bypass is exact: output = input + sum((gain_band - 1) * band), so unity
   gain leaves the input untouched bit for bit. */
(function (root) {
  'use strict';
  var HOP_MS = 1, WIN_MS = 10;

  var DEFAULTS = {
    bands: 3, xo: [250, 3000, 8000],
    tailStart: 18,   // dB below a hit's peak where the body ends and the tail starts
    keep: 60,        // ms of tail kept before the fade starts
    fade: 150,       // ms fade length
    depth: 60,       // dB maximum cut
    curve: 0,        // -100..100 fade shape (+ = fast first)
    guard: 50,       // % sustain guard (a level dip must be a real decay)
    echo: 8,         // dB: a hit this far under the last hit is an echo (0 = off)
    floor: -70,      // dB: quieter than this counts as silence (-90 = off)
    protect: 12,     // ms after a hit where no tail may start
    open: 4,         // ms to open before the next hit
    sens: 6,         // dB rise that counts as a hit
    mix: 100,        // % wet
    amount: [100, 100, 100, 100] // % of depth per band
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function withDefaults(p) {
    var o = clone(DEFAULTS);
    if (p) for (var k in p) if (p[k] !== undefined) o[k] = p[k];
    return o;
  }

  /* ---------- filters (Butterworth 2nd order, two in series = LR4) ---------- */
  function biquad(type, f, sr) {
    var w = 2 * Math.PI * Math.min(f, sr * 0.45) / sr, cw = Math.cos(w), al = Math.sin(w) / (2 * Math.SQRT1_2);
    var b0, b1, b2, a0 = 1 + al, a1 = -2 * cw, a2 = 1 - al;
    if (type === 'lp') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0; }
    else { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = b0; }
    return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 };
  }
  function run(c, x) {
    var y = new Float32Array(x.length), x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (var i = 0; i < x.length; i++) {
      var xi = x[i], yi = c.b0 * xi + c.b1 * x1 + c.b2 * x2 - c.a1 * y1 - c.a2 * y2;
      if (!(yi === yi) || Math.abs(yi) > 1e6) { yi = 0; x1 = x2 = y1 = y2 = 0; } // NaN guard
      y[i] = yi; x2 = x1; x1 = xi; y2 = y1; y1 = yi;
    }
    return y;
  }
  function lr4(type, f, sr, x) { var c = biquad(type, f, sr); return run(c, run(c, x)); }

  /* Split one channel into n bands. Each band is a 4th order low pass of what
     is left; the top band is the remainder. Because every high part is the
     input minus the low part, the bands add back to the input exactly. */
  function split(x, sr, n, xo) {
    var out = [], rest = x;
    for (var b = 0; b < n - 1; b++) {
      var lo = lr4('lp', xo[b], sr, rest), hi = new Float32Array(rest.length);
      for (var i = 0; i < rest.length; i++) hi[i] = rest[i] - lo[i];
      out.push(lo); rest = hi;
    }
    out.push(rest);
    return out;
  }

  /* ---------- level follower ---------- */
  function envelope(L, R, sr) {
    var hop = Math.max(1, Math.round(sr * HOP_MS / 1000)), win = Math.round(sr * WIN_MS / 1000);
    var n = L.length, S = new Float64Array(n + 1);
    for (var i = 0; i < n; i++) {
      var a = L[i] * L[i], b = R ? R[i] * R[i] : a;
      S[i + 1] = S[i] + (a > b ? a : b);
    }
    var nh = Math.floor(n / hop) + 1, env = new Float32Array(nh);
    for (var h = 0; h < nh; h++) {
      var c = h * hop, lo = Math.max(0, c - (win >> 1)), hi = Math.min(n, c + (win >> 1));
      var m = hi > lo ? (S[hi] - S[lo]) / (hi - lo) : 0;
      env[h] = 10 * Math.log10(m + 1e-12);
    }
    return { env: env, hop: hop };
  }

  /* Analyse: bands and their levels. Slow part; only redo if the audio or
     the crossovers change. */
  function analyze(L, R, sr, bands, xo) {
    var nb = Math.max(1, Math.min(4, bands | 0)), bl, br;
    if (nb === 1) { bl = [L]; br = [R]; }
    else { bl = split(L, sr, nb, xo); br = split(R, sr, nb, xo); }
    var envs = [], hop = 0;
    for (var b = 0; b < nb; b++) { var e = envelope(bl[b], br[b], sr); envs.push(e.env); hop = e.hop; }
    return { sr: sr, n: L.length, nb: nb, hop: hop, envs: envs, bandL: bl, bandR: br, xo: xo.slice(0, 3) };
  }

  /* ---------- decide where the tails are ---------- */
  function deriveBand(env, p, amountPct) {
    var N = env.length, ms = function (v) { return Math.max(0, Math.round(v / HOP_MS)); };
    var gain = new Float32Array(N), tails = [], hits = [];
    var k = 12, cands = [], last = -1e9;
    for (var i = k; i < N; i++) {
      if (env[i] < -85 || i - last < 40) continue;
      var mn = 1e9;
      for (var j = i - k; j < i; j++) if (env[j] < mn) mn = env[j];
      if (env[i] - mn >= p.sens && env[i] >= env[i - 1]) {
        // walk back to where the rise began
        var s = i; while (s > 1 && env[s - 1] < env[s] - 0.3 && i - s < 12) s--;
        cands.push(s); last = i;
      }
    }
    // peak of each candidate, then echo guard
    var peakWin = 120, lastPeak = -1e9, lastIdx = -1e9, echoWin = 2000;
    for (var c = 0; c < cands.length; c++) {
      var a = cands[c], pk = -1e9, ip = a;
      for (var q = a; q < Math.min(N, a + peakWin); q++) if (env[q] > pk) { pk = env[q]; ip = q; }
      if (p.echo > 0 && a - lastIdx <= echoWin && pk < lastPeak - p.echo) continue; // echo: part of the last tail
      hits.push({ a: a, peak: pk, ip: ip }); lastPeak = pk; lastIdx = a;
    }
    var depth = p.depth * (amountPct / 100);
    if (depth <= 0.001) return { gain: gain, tails: tails, hits: hits };
    var keepH = ms(p.keep), fadeH = Math.max(1, ms(p.fade)), openH = Math.max(1, ms(p.open)), leadH = 8;
    var slopeMin = 30 * (p.guard / 100); // dB per second
    var kk = Math.pow(2, (p.curve / 100) * 2);
    for (var h = 0; h < hits.length; h++) {
      var hit = hits[h], b = h + 1 < hits.length ? hits[h + 1].a : N;
      var P = hit.peak, t0 = -1, fromFloor = false;
      var from = Math.max(hit.ip, hit.a + ms(p.protect));
      for (var t = from; t < b; t++) { if (env[t] <= P - p.tailStart) { t0 = t; break; } }
      if (p.floor > -89) {
        for (var u = from; u < b; u++) { if (env[u] <= p.floor) { if (t0 < 0 || u < t0) { t0 = u; fromFloor = true; } break; } }
      }
      if (t0 < 0) continue;
      if (!fromFloor) {                     // sustain guard: must really be decaying
        var wd = Math.min(250, b - t0);
        if (wd < 20) continue;
        var mnv = 1e9; for (var w = t0; w < t0 + wd; w++) if (env[w] < mnv) mnv = env[w];
        if (env[t0] - mnv < slopeMin * wd / 1000) continue;
      }
      var iF = t0 + keepH, iE = iF + fadeH;
      var rs = (b >= N) ? N + 1e6 : b - leadH - openH;       // ramp start
      if (rs <= iF) continue;                                 // next hit too soon: nothing to cut
      var endFade = Math.min(iE, rs), gAt = 0;
      for (var m = iF; m <= Math.min(N - 1, rs) && m < N; m++) {
        var u2 = Math.min(1, (m - iF) / fadeH);
        var shape = 1 - Math.pow(1 - u2, kk);
        var g = -depth * shape;
        if (m > endFade) g = gAt; else gAt = g;
        gain[m] = g;
      }
      if (b < N) {
        var a0 = Math.pow(10, gAt / 20);
        for (var r = 1; r <= openH && rs + r < N; r++) {
          var uu = r / openH, aa = a0 + (1 - a0) * (0.5 - 0.5 * Math.cos(Math.PI * uu));
          gain[rs + r] = 20 * Math.log10(aa);
        }
      }
      tails.push({ t0: t0, from: iF, to: b >= N ? N - 1 : rs, peak: P });
    }
    return { gain: gain, tails: tails, hits: hits };
  }

  /* Derive the gain curves for all bands from the analysis. Fast: call it on
     every knob change. */
  function derive(an, params) {
    var p = withDefaults(params), res = [];
    for (var b = 0; b < an.nb; b++) res.push(deriveBand(an.envs[b], p, p.amount[b] === undefined ? 100 : p.amount[b]));
    return { bands: res, params: p };
  }

  /* ---------- apply ---------- */
  function perSample(gainHop, hop, n) {
    var g = new Float32Array(n), N = gainHop.length;
    for (var i = 0; i < n; i++) {
      var x = i / hop, i0 = Math.floor(x), f = x - i0, i1 = i0 + 1 < N ? i0 + 1 : i0;
      var db = gainHop[i0] + (gainHop[i1] - gainHop[i0]) * f;
      g[i] = db === 0 ? 1 : Math.pow(10, db / 20);
    }
    return g;
  }

  function render(an, der, L, R) {
    var n = an.n, p = der.params, mix = p.mix / 100;
    var oL = new Float32Array(L), oR = new Float32Array(R), gm = [];
    for (var b = 0; b < an.nb; b++) {
      var gh = der.bands[b].gain, any = false;
      for (var i = 0; i < gh.length; i++) if (gh[i] !== 0) { any = true; break; }
      if (!any) { gm.push(null); continue; }
      var g = perSample(gh, an.hop, n); gm.push(g);
      var bl = an.bandL[b], br = an.bandR[b];
      for (var s = 0; s < n; s++) { var d = (g[s] - 1) * mix; oL[s] += d * bl[s]; oR[s] += d * br[s]; }
    }
    return { L: oL, R: oR };
  }

  /* Numbers for the read-outs. */
  function stats(an, der, L, R, O) {
    var tails = 0, eIn = 0, eOut = 0, maxCut = 0;
    der.bands.forEach(function (b) { tails += b.tails.length; for (var i = 0; i < b.gain.length; i++) if (b.gain[i] < maxCut) maxCut = b.gain[i]; });
    for (var i = 0; i < L.length; i++) { eIn += L[i] * L[i] + R[i] * R[i]; eOut += O.L[i] * O.L[i] + O.R[i] * O.R[i]; }
    return { tails: tails, removedDb: 10 * Math.log10((eOut + 1e-20) / (eIn + 1e-20)), maxCut: maxCut };
  }

  var API = { envelope: envelope, DEFAULTS: DEFAULTS, HOP_MS: HOP_MS, WIN_MS: WIN_MS, withDefaults: withDefaults,
    analyze: analyze, derive: derive, render: render, stats: stats, perSample: perSample };
  if (typeof module !== 'undefined' && module.exports) module.exports = API; else root.TC = API;
})(typeof self !== 'undefined' ? self : this);

</script>

$('#pExp').onclick=function(){var t=JSON.stringify({tailchaser:1,name:curName,params:snap()});openDlg('<h2>Export preset</h2><p>Copy this text and keep it somewhere.</p><textarea id="dx" readonly>'+t.replace(/</g,'&lt;')+'</textarea>',[{t:'Select all',f:function(){$('#dx').select();return false}},{t:'Close'}])};
$('#pImp').onclick=function(){openDlg('<h2>Import preset</h2><p>Paste the preset text.</p><textarea id="dx"></textarea><p id="de" style="color:var(--pink)"></p>',[{t:'Import',c:'mint',f:function(){try{var o=JSON.parse($('#dx').value);if(!o||o.tailchaser!==1||typeof o.params!=='object')throw 0;var p={};K.forEach(function(k){var v=o.params[k.id];if(typeof v==='number'&&isFinite(v))p[k.id]=Math.max(k.min,Math.min(k.max,v))});
 if(typeof o.params.bands==='number')p.bands=Math.max(1,Math.min(4,Math.round(o.params.bands)));var n=uniq(String(o.name||'Imported').slice(0,40));user.push({n:n,p:p});saveUser();curName=n;applyP(p);fillSel()}catch(e){$('#de').textContent='That is not a Tail Chaser preset.';return false}}},{t:'Cancel'}])};

$('#bGuide').onclick=function(){openDlg('<h2>Guide</h2><ul><li><b>What it does:</b> finds the tails of reverb and delay (and any quiet leftovers) and fades them out, so the mix stays tight with more silence between hits.</li><li><b>Scan:</b> in the plugin, play the track once. The plugin learns where every hit and tail is, then reads the cut curve exactly, with no delay. Knobs work instantly after a scan.</li><li><b>The display:</b> lavender = original level, mint = cleaned level, pink = what was removed. Each band has its own lane; yellow triangles are hits, orange lines are where a tail starts.</li><li><b>Start here:</b> Depth sets how much, Keep and Fade set how natural it sounds, Tail start sets where the tail begins.</li><li><b>Check it:</b> press 3 (Removed). Hear only what is cut. If you hear notes, back off.</li></ul><p>Keys: <kbd>Space</kbd> play/stop &nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> original/cleaned/removed &nbsp; <kbd>Home</kbd> to start &nbsp; double-click a knob to reset it.</p>',[{t:'Close'}])};
$('#bSet').onclick=function(){openDlg('<h2>Settings</h2><label><input type="checkbox" id="sb"'+(settings.bubbles?' checked':'')+'> Info bubbles</label><label><input type="checkbox" id="sp"'+(settings.power?' checked':'')+'> Power saving (slower display)</label><label>Look <select id="st"><option value="a">A Neon Navy</option><option value="b">B Purple Soda Pop</option><option value="c">C PurrOne</option></select></label>',[{t:'OK',c:'mint',f:function(){settings.bubbles=$('#sb').checked;settings.power=$('#sp').checked;settings.theme=$('#st').value;document.body.dataset.theme=settings.theme;saveSet();draw()}}]);$('#st').value=settings.theme};
$('#bAbout').onclick=function(){openDlg('<h2>About &amp; Support</h2><p><b>Tail Chaser</b> by Studio 87, version 1 design mockup.</p><p>Licence: AGPL-3.0-or-later. Source: github.com/SpeakingColors/TailChaser</p><p>Your own presets live in the plugin\'s Studio 87 / Tail Chaser / presets folder (Windows: %APPDATA%, macOS: Application Support, Linux: XDG data folder).</p><p>Uninstall: use the uninstaller from the download zip. It leaves your presets unless you tell it to delete them.</p><p><a href="https://ko-fi.com/studio87" target="_blank" rel="noopener" style="color:var(--mint)">Support on Ko-fi</a></p>',[{t:'Close'}])};

/* ---------- print ---------- */
function dl(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function wavBlob(L,R,sr){var n=L.length,b=new ArrayBuffer(44+n*8),v=new DataView(b),w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*8,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,3,true);v.setUint16(22,2,true);v.setUint32(24,sr,true);v.setUint32(28,sr*8,true);v.setUint16(32,8,true);v.setUint16(34,32,true);w(36,'data');v.setUint32(40,n*8,true);
 for(var i=0;i<n;i++){v.setFloat32(44+i*8,L[i],true);v.setFloat32(48+i*8,R[i],true)}return new Blob([b],{type:'audio/wav'})}
$('#bPrint').onclick=function(){openDlg('<h2>Print the result</h2><p><b>Write automation (plugin only):</b> the plugin has a Cut parameter that is your host\'s automation lane. Set the track to Write, press Write in the plugin, play once; the cuts are recorded as automation. Then switch the plugin to Read and it follows that lane, so you can edit the curve by hand. This is how fader-riding plugins do it. Not available in this mockup, and not yet tried in Bitwig or Studio One.</p><p><b>Export now:</b></p>',
 [{t:'Cut curve (CSV)',f:function(){var rows=['time_s,'+der.bands.map(function(b,i){return'band'+(i+1)+'_db'}).join(',')],hop=SR*TC.HOP_MS/1000,nh=der.bands[0].gain.length;for(var i=0;i<nh;i+=1){rows.push((i*TC.HOP_MS/1000).toFixed(3)+','+der.bands.map(function(b){return b.gain[i].toFixed(2)}).join(','))}dl('tail-chaser-cuts.csv',new Blob([rows.join('\n')],{type:'text/csv'}));return false}},
 {t:'Cleaned audio (WAV)',c:'mint',f:function(){dl('tail-chaser-cleaned.wav',wavBlob(out.L,out.R,SR));return false}},{t:'Close'}])};

/* ---------- per band amounts in lanes: small row under display ---------- */
function buildAmounts(){var row=$('#amtRow');if(!row){row=document.createElement('div');row.id='amtRow';row.style.cssText='display:flex;gap:10px;margin-top:4px;align-items:center';$('#chips').parentNode.insertBefore(row,$('#chips'))}
 row.innerHTML='<span class="chip" style="color:var(--ttl)" data-tip="How much of Depth each band gets. Turn a band down to leave its tails, for example keep the low band natural.">Band amount</span>';
 for(var b=0;b<P.bands;b++){(function(b){var s=document.createElement('label');s.style.cssText='display:flex;align-items:center;gap:4px;font:600 13px Barlow Condensed;color:'+BC[b];s.innerHTML='B'+(b+1)+'<input type="range" min="0" max="100" value="'+P.amount[b]+'" style="width:110px;accent-color:'+BC[b]+'"><span class="chip" style="min-width:48px;text-align:center">'+P.amount[b]+' %</span>';
  var r=$('input',s),v=$('.chip',s);r.oninput=function(){P.amount[b]=+r.value;v.textContent=r.value+' %';soon()};r.ondblclick=function(){r.value=100;r.oninput()};row.appendChild(s)})(b)}}

/* ---------- window: scale, handles, cheeks ---------- */
var scaleDef=1,scale=1,stage=$('#stage');
function sc(){return scale}
function fit(){scaleDef=Math.max(.35,Math.min(1.5,Math.min(innerWidth/1360,innerHeight/800)));if(!userScaled)scale=scaleDef;applyScale()}
var userScaled=false;
function applyScale(){stage.style.transform='translate(-50%,-50%) scale('+scale+')';$('#zoom').textContent=Math.round(scale/scaleDef*100)+'%';sizeCv();draw()}
addEventListener('resize',fit);
var HS=[['nw',-1,-1],['n',0,-1],['ne',1,-1],['e',1,0],['se',1,1],['s',0,1],['sw',-1,1],['w',-1,0]];
HS.forEach(function(h){var d=document.createElement('div');d.className='h';d.style.cssText='position:fixed;z-index:30;'+(h[1]===0?'left:20%;right:20%;height:8px;':'width:'+(h[2]===0?8:16)+'px;')+(h[2]===0?'top:20%;bottom:20%;':(h[1]===0?'':'height:16px;'))+(h[0]==='nw'?'left:0;top:0;cursor:nwse-resize':h[0]==='ne'?'right:0;top:0;cursor:nesw-resize':h[0]==='se'?'right:0;bottom:0;cursor:nwse-resize':h[0]==='sw'?'left:0;bottom:0;cursor:nesw-resize':h[0]==='n'?'top:0;cursor:ns-resize':h[0]==='s'?'bottom:0;cursor:ns-resize':h[0]==='w'?'left:0;cursor:ew-resize':'right:0;cursor:ew-resize');document.body.appendChild(d);
 var st0=null;d.onpointerdown=function(e){d.setPointerCapture(e.pointerId);st0={x:e.clientX,y:e.clientY,s:scale}};
 d.onpointermove=function(e){if(!st0)return;var dx=(e.clientX-st0.x)*h[1],dy=(e.clientY-st0.y)*h[2],k=h[1]&&h[2]?(dx/1360+dy/800)/2:h[1]?dx/1360:dy/800;scale=Math.max(.3,Math.min(2,st0.s*(1+2*k)));userScaled=true;applyScale()};
 d.onpointerup=function(){st0=null}});
document.querySelectorAll('.cheek').forEach(function(c){c.addEventListener('dblclick',function(){userScaled=false;scale=scaleDef;applyScale()})});
function wood(c){var w=44,h=800,k=document.createElement('canvas');k.width=w;k.height=h;var x=k.getContext('2d');x.fillStyle='#3d2210';x.fillRect(0,0,w,h);var s=7;function r(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}
 for(var i=0;i<w;){var wd=1+Math.floor(r()*4);x.fillStyle=r()<.5?'rgba(123,74,38,.4)':'rgba(90,52,25,.75)';x.fillRect(i,0,wd,h);i+=wd+Math.floor(r()*3)}
 for(var j=0;j<60;j++){x.fillStyle='rgba(20,10,4,.25)';x.fillRect(Math.floor(r()*w),Math.floor(r()*h),1,20+Math.floor(r()*120))}
 x.fillStyle='#000';x.fillRect(c.id==='chL'?w-2:0,0,2,h);c.style.background='url('+k.toDataURL()+')';c.style.backgroundSize='100% 100%'}
wood($('#chL'));wood($('#chR'));

/* ---------- info bubbles ---------- */
var tipEl=$('#tip'),tipT=0;
function tipHide(){clearTimeout(tipT);tipEl.style.display='none'}
document.addEventListener('pointerover',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');clearTimeout(tipT);tipEl.style.display='none';if(!t||!settings.bubbles)return;tipT=setTimeout(function(){tipEl.textContent=t.dataset.tip;tipEl.style.display='block';var r=t.getBoundingClientRect(),w=tipEl.offsetWidth;tipEl.style.left=Math.max(4,Math.min(innerWidth-w-4,r.left))+'px';tipEl.style.top=Math.min(innerHeight-tipEl.offsetHeight-4,r.bottom+6)+'px'},1000)});

 if(e.code==='Space'){e.preventDefault();$('#bPlay').click()}else if(e.key==='1')setMode('dry');else if(e.key==='2')setMode('proc');else if(e.key==='3')setMode('delta');else if(e.key==='Home')seek(0)});

refreshKnobs();fillSel();buildAmounts();fit();loadSource('drums');scan=0;requestAnimationFrame(frame);
