<style>
/*FONTS*/
:root{--w:1360px;--h:800px}

body[data-theme=a]{--bg:#161638;--pn:#1c1c4a;--pn2:#2C2C62;--ln:#33403f;--dp:#05060d;--tx:#e8e6e1;--dim:#b8b4d8;--ttl:#c7c9ff;--mint:#02EBBA;--pink:#FF1383;--pur:#A43DFF;--yel:#FFD100;--sky:#6CC9F5;--amb:#FFA600;--sel:#3a2a5a;--selb:#FFA600;--grid:#232a48}
body[data-theme=c]{--bg:#121214;--pn:#202023;--pn2:#2a2a2e;--ln:#3a3a40;--dp:#0a0a0b;--tx:#ffffff;--dim:#c4c4cc;--ttl:#ffffff;--mint:#02EBBA;--pink:#FF1383;--pur:#A43DFF;--yel:#FFD100;--sky:#6CC9F5;--amb:#FFA600;--sel:#33333a;--selb:#ffffff;--grid:#26262b}

header{display:flex;align-items:center;gap:10px;height:42px}
.logo{width:36px;height:34px;flex:none}
.name{font-weight:700;font-size:26px;letter-spacing:.5px;color:var(--ttl)}

.sp{flex:1}

.pre select{min-width:170px}
#body{flex:1;display:flex;gap:10px;min-height:0}
#left{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}

.chip{background:var(--dp);border:1px solid var(--ln);border-radius:5px;padding:1px 8px;font:500 13px 'JetBrains Mono',monospace;white-space:nowrap;color:var(--dim)}
.chip b{color:var(--yel);font-weight:500}
#ctl{display:flex;gap:8px}
.grp{display:flex;flex-direction:column}
.row{display:flex;gap:2px}
.knob{width:54px;display:flex;flex-direction:column;align-items:center;cursor:ns-resize}
.knob svg{width:46px;height:46px}
.knob .l{font-size:14px;font-weight:600;color:var(--sky);line-height:14px;margin-top:-2px;text-align:center}
.knob .v{font:500 12px 'JetBrains Mono',monospace;color:var(--yel);background:var(--dp);border:1px solid var(--ln);border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap}
.knob.off{opacity:.35}
.seg{display:flex;flex-direction:column;align-items:center;width:112px}
.seg .l{font-size:14px;font-weight:600;color:var(--sky)}
.seg .b{display:flex;margin-top:6px}
.seg button{border-radius:0;padding:4px 9px;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
#meters{width:150px;display:flex;flex-direction:column}
#meters .mrow{flex:0 0 auto!important}
#meters .mrow{display:flex;gap:6px;flex:1;justify-content:center}
.mcol{display:flex;flex-direction:column;align-items:center}
.mcol .t{font-size:14px;font-weight:700;color:var(--ttl)}
.mcol canvas{background:var(--dp);border-radius:4px}
.mcol .pk{font:500 11px 'JetBrains Mono',monospace;color:var(--yel);height:14px}
#rig{display:flex;align-items:center;gap:8px;border:1px dashed var(--ln);border-radius:8px;padding:4px 8px;background:transparent}
#rig .tag{font-size:13px;color:var(--amb);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
#foot{display:flex;justify-content:space-between;font:500 11px 'JetBrains Mono',monospace;color:var(--dim);height:14px}
.h{position:absolute;z-index:5}
#tip{position:fixed;z-index:50;max-width:300px;background:#000;border:1px solid var(--selb,#CD92FE);color:#f4f5f7;font:500 15px 'Barlow Condensed',sans-serif;padding:5px 9px;border-radius:6px;pointer-events:none;display:none}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
#dlg{background:var(--pn);border:1px solid var(--selb);border-radius:10px;padding:14px 16px;min-width:420px;max-width:760px;max-height:90%;overflow:auto;font-size:17px}

#dlg p,#dlg li{margin:4px 0;color:var(--tx);line-height:1.15}
#dlg input[type=text],#dlg textarea{width:100%;background:var(--dp);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:5px 8px;font:500 14px 'JetBrains Mono',monospace}
#dlg textarea{height:160px}
#dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#dlg label{display:flex;align-items:center;gap:8px;margin:6px 0}
#dlg kbd{background:var(--dp);border:1px solid var(--ln);border-radius:4px;padding:0 6px;font:500 13px 'JetBrains Mono',monospace;color:var(--yel)}
</style></head>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var SR=44100, ctx=null;
try{ctx=new (window.AudioContext||window.webkitAudioContext)();SR=ctx.sampleRate}catch(e){}
var DUR=8;

/* ---------- preview sounds (made here, not samples) ---------- */
var seed=1;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296*2-1}
function mk(n){return{L:new Float32Array(n),R:new Float32Array(n)}}
function addTail(s,t,lvl,rt60,damp){var i0=Math.round(t*SR),n=Math.min(Math.round(rt60*1.2*SR),s.L.length-i0),k=6.9078/(rt60*SR),a=0,b=0,d=damp||0.5;
 for(var i=0;i<n;i++){var e=lvl*Math.exp(-i*k);a+=(rnd()-a)*d;b+=(rnd()-b)*d;s.L[i0+i]+=e*a;s.R[i0+i]+=e*b}}
function kick(s,t,l){var i0=Math.round(t*SR),n=Math.round(.35*SR),ph=0;for(var i=0;i<n&&i0+i<s.L.length;i++){var f=48+110*Math.exp(-i/(.025*SR));ph+=2*Math.PI*f/SR;var v=l*Math.exp(-i/(.11*SR))*Math.sin(ph);s.L[i0+i]+=v;s.R[i0+i]+=v}}
function snare(s,t,l){var i0=Math.round(t*SR),n=Math.round(.22*SR),lp=0;for(var i=0;i<n&&i0+i<s.L.length;i++){var e=Math.exp(-i/(.06*SR));lp+=(rnd()-lp)*.7;var v=l*e*(lp*.8+.5*Math.sin(2*Math.PI*190*i/SR));s.L[i0+i]+=v;s.R[i0+i]+=v}}
function hat(s,t,l){var i0=Math.round(t*SR),n=Math.round(.05*SR),h=0;for(var i=0;i<n&&i0+i<s.L.length;i++){var x=rnd();var y=x-h;h=x;var v=l*Math.exp(-i/(.012*SR))*y*.6;s.L[i0+i]+=v;s.R[i0+i]+=v*.9}}
function chord(s,t,l,len){var i0=Math.round(t*SR),n=Math.round(len*SR),fs=[220,277.2,329.6,440];for(var i=0;i<n&&i0+i<s.L.length;i++){var e=Math.exp(-i/(.12*SR));if(i<200)e*=i/200;var v=0;for(var q=0;q<4;q++){var ph=(fs[q]*i/SR)%1;v+=(ph*2-1)*.25+((fs[q]*1.004*i/SR)%1*2-1)*.25}v*=l*e;s.L[i0+i]+=v;s.R[i0+i]+=v}}
function pingpong(src,delay,fb,mix){var n=src.L.length,d=Math.round(delay*SR),out=mk(n),tL=new Float32Array(n),tR=new Float32Array(n);
 for(var i=0;i<n;i++){var fL=i>=d?tR[i-d]:0,fR=i>=d?tL[i-d]:0;tL[i]=src.L[i]*.7+fL*fb;tR[i]=src.R[i]*.7+fR*fb;
  out.L[i]=src.L[i]+(i>=d?tR[i-d]*mix:0);out.R[i]=src.R[i]+(i>=d?tL[i-d]*mix:0)}return out}
function genDrums(){seed=11;var n=DUR*SR,s=mk(n),B=.46875;for(var b=0;b<16;b++){var t=.2+b*B;if(b%2===0)kick(s,t,.8);if(b%4===2){snare(s,t,.55);addTail(s,t,.12,1.8,.45)}if(b%8===6)snare(s,t+B*.625,.09);hat(s,t+B/2,.22);if(b%4===3)hat(s,t+B/4,.18)}return s}
function genStab(){seed=22;var n=DUR*SR,d=mk(n),B=.46875;[0,1.5,3,4.5,6,7.5,9,10.5].forEach(function(b){chord(d,.2+b*B,.22,.4)});
 var o=pingpong(d,.3516,.45,.5);var g=mk(n);for(var i=0;i<n;i++){g.L[i]=o.L[i];g.R[i]=o.R[i]}[0,3,6,9].forEach(function(b){addTail(g,.2+b*B,.02,1.2,.3)});return g}
function genMix(){var a=genDrums(),b=genStab(),n=a.L.length,s=mk(n);seed=33;var B=.46875;
 for(var i=0;i<n;i++){s.L[i]=a.L[i]*.8+b.L[i]*.8;s.R[i]=a.R[i]*.8+b.R[i]*.8}
 for(var q=0;q<4;q++){var t0=.2+q*4*B*1,len=Math.round(1.7*SR),i0=Math.round(t0*SR),f=q%2?49:55;for(var i=0;i<len&&i0+i<n;i++){var e=Math.min(1,i/400)*Math.min(1,(len-i)/2000);var v=.28*e*Math.sin(2*Math.PI*f*i/SR);s.L[i0+i]+=v;s.R[i0+i]+=v}}
 return s}
var sources={drums:genDrums,stab:genStab,mix:genMix};

/* ---------- parameters ---------- */
var K=[
 {id:'x1',l:'X1',min:60,max:1000,def:250,u:' Hz',log:1,tip:'Where the lowest band ends. Each band follows its own tails, so a long bass note is not cut just because the reverb above it is.'},
 {id:'x2',l:'X2',min:600,max:6000,def:3000,u:' Hz',log:1,tip:'Border between the middle bands.'},
 {id:'x3',l:'X3',min:3000,max:14000,def:8000,u:' Hz',log:1,tip:'Border between the upper bands.'},
 {id:'tailStart',l:'Tail start',min:6,max:40,def:18,u:' dB',tip:'How far below a hit\'s peak the body ends and the tail starts. Lower = the tail starts earlier and more is cut. Higher = only the quiet end is touched.'},
 {id:'sens',l:'Hit sens',min:3,max:15,def:6,u:' dB',tip:'How much louder a sound must jump to count as a new hit. Lower finds soft hits; higher ignores small bumps.'},
 {id:'guard',l:'Guard',min:0,max:100,def:50,u:' %',tip:'Protects held sounds. A quiet part is only a tail if the level really keeps falling. Raise it if pads or long notes get cut; lower it to cut slow tails.'},
 {id:'echo',l:'Echo',min:0,max:24,def:8,u:' dB',off0:1,tip:'Removes delay repeats. A new sound counts as an echo only if it is this many dB under the last hit AND sounds like it (same tone). A different sound, like a hi-hat after a snare, is always kept. 0 = off, then repeats count as hits.'},
 {id:'floor',l:'Floor',min:-90,max:-30,def:-70,u:' dB',offm:-90,tip:'Silence in: anything quieter than this is cut too, tail or not (noise, bleed, room). -90 = off. You can also drag the dashed line in the display.'},
 {id:'protect',l:'Protect',min:0,max:50,def:12,u:' ms',tip:'After a hit, no tail may start for this long. Keeps the body of the hit safe.'},
 {id:'keep',l:'Keep',min:0,max:1500,def:60,u:' ms',sync:3,tip:'How long the tail stays untouched after it starts, before the fade begins. More Keep = a natural, longer ring.'},
 {id:'fade',l:'Fade',min:5,max:2000,def:150,u:' ms',log:1,sync:6,tip:'How long the fade down takes. Short = gated, tight. Long = smooth and natural.'},
 {id:'depth',l:'Depth',min:0,max:96,def:60,u:' dB',tip:'The most a tail can be turned down. 60 dB is almost silence; 12 dB only tucks the tail back. 0 = untouched.'},
 {id:'curve',l:'Curve',min:-100,max:100,def:0,u:' %',tip:'Shape of the fade. Plus = most of the drop happens early. Minus = the tail holds on, then drops.'},
 {id:'open',l:'Open',min:3,max:30,def:4,u:' ms',tip:'How fast the sound opens again before the next hit. The plugin knows the next hit is coming, so the hit itself is never cut. 3 ms is the shortest, faster could click on bass.'},
 {id:'smooth',l:'Smooth',min:0,max:6,def:3,u:' ms',tip:'Rounds the corners of every cut so fast cuts do not click. 0 = off. More = softer edges, a little less punch on very fast fades. Measured: 3 ms lowers click energy by about 14 to 20 dB.'},

 if(mode==='delta'){if(!delta){delta=mk(sig.L.length);for(var i=0;i<delta.L.length;i++){delta.L[i]=sig.L[i]-out.L[i];delta.R[i]=sig.R[i]-out.R[i]}}bufs.delta=bufs.delta||mkBuf(delta.L,delta.R);return bufs.delta}
 bufs.proc=bufs.proc||mkBuf(out.L,out.R);return bufs.proc}
function startAudio(off){if(!ctx)return;ctx.resume();stopSrc();gainNode=gainNode||ctx.createGain();gainNode.gain.value=.8;gainNode.connect(ctx.destination);
 srcNode=ctx.createBufferSource();srcNode.buffer=curBuf();srcNode.loop=true;srcNode.connect(gainNode);srcNode.start(0,off);t0c=ctx.currentTime-off;playing=true;$('#bPlay').textContent='■ Stop'}

 SR=buf.sampleRate;DUR=n/SR;sig={L:L,R:R};envIn=null;bufs={};analyseNow();scan=0},function(){alert('Could not read that file.')})};fr.readAsArrayBuffer(f)};

/* ---------- presets ---------- */
function allPresets(){return FACT.map(function(f){return{n:f.n,p:f.p,f:1}}).concat(user.map(function(u){return{n:u.n,p:u.p,f:0}}))}
function fillSel(){var s=$('#pSel');s.innerHTML='';allPresets().forEach(function(p,i){var o=document.createElement('option');o.value=i;o.textContent=(p.f?'• ':'')+p.n;if(p.n===curName)o.selected=true;s.appendChild(o)})}
function snap(){var o={sync:P.sync};K.forEach(function(k){o[k.id]=P[k.id];if(k.sync!==undefined)o[k.id+'N']=P[k.id+'N']});o.bands=P.bands;o.amount=P.amount.slice();return o}
function applyP(p){var d={sync:0,bands:3,amount:[100,100,100,100]};K.forEach(function(k){d[k.id]=k.def;if(k.sync!==undefined)d[k.id+'N']=k.sync});Object.keys(d).forEach(function(k){P[k]=p[k]!==undefined?JSON.parse(JSON.stringify(p[k])):d[k]});$('#bSync').classList.toggle('on',!!P.sync);refreshKnobs();analyseNow();buildAmounts()}
function pick(i){var a=allPresets(),p=a[(i+a.length)%a.length];curName=p.n;applyP(p.p);fillSel()}
$('#pSel').onchange=function(){pick(+this.value)};
$('#pPrev').onclick=function(){var a=allPresets(),i=a.findIndex(function(p){return p.n===curName});pick(i-1)};

 openDlg('<h2>Delete "'+curName.replace(/</g,'')+'"?</h2><p>This cannot be undone.</p>',[{t:'Delete',c:'mint',f:function(){user=user.filter(function(x){return x!==u});saveUser();pick(0)}},{t:'Cancel'}])};
$('#pExp').onclick=function(){var t=JSON.stringify({tailchaser:1,name:curName,params:snap()});openDlg('<h2>Export preset</h2><p>Copy this text and keep it somewhere.</p><textarea id="dx" readonly>'+t.replace(/</g,'&lt;')+'</textarea>',[{t:'Select all',f:function(){$('#dx').select();return false}},{t:'Close'}])};
$('#pImp').onclick=function(){openDlg('<h2>Import preset</h2><p>Paste the preset text.</p><textarea id="dx"></textarea><p id="de" style="color:var(--pink)"></p>',[{t:'Import',c:'mint',f:function(){try{var o=JSON.parse($('#dx').value);if(!o||o.tailchaser!==1||typeof o.params!=='object')throw 0;var p={};K.forEach(function(k){var v=o.params[k.id];if(typeof v==='number'&&isFinite(v))p[k.id]=Math.max(k.min,Math.min(k.max,v));if(k.sync!==undefined){var nv=o.params[k.id+'N'];if(typeof nv==='number'&&isFinite(nv))p[k.id+'N']=Math.max(0,Math.min(noteList(k).length-1,Math.round(nv)))}});p.sync=o.params.sync?1:0;
 if(typeof o.params.bands==='number')p.bands=Math.max(1,Math.min(4,Math.round(o.params.bands)));var n=uniq(String(o.name||'Imported').slice(0,40));user.push({n:n,p:p});saveUser();curName=n;applyP(p);fillSel()}catch(e){$('#de').textContent='That is not a Tail Chaser preset.';return false}}},{t:'Cancel'}])};

$('#bGuide').onclick=function(){openDlg('<h2>Guide</h2><ul><li><b>What it does:</b> finds the tails of reverb and delay (and any quiet leftovers) and fades them out, so the mix stays tight with more silence between hits.</li><li><b>Scan:</b> in the plugin, play the track once. The plugin learns where every hit and tail is, then reads the cut curve exactly, with no delay. Knobs work instantly after a scan.</li><li><b>The display:</b> lavender = original level, mint = cleaned level, pink = what was removed. Each band has its own lane; yellow triangles are hits, orange lines are where a tail starts.</li><li><b>Start here:</b> Depth sets how much, Keep and Fade set how natural it sounds, Tail start sets where the tail begins.</li><li><b>Check it:</b> press 3 (Removed). Hear only what is cut. If you hear notes, back off.</li><li><b>Delays:</b> Echo removes repeats. Echo time on Auto learns the delay time from the song (shown in the Echo chip); a quiet note that is not on that time grid is kept. Set it by hand if Auto shows none.</li><li><b>Sync:</b> Keep, Fade and Echo time in note values that follow the tempo.</li><li><b>Center:</b> lower it to keep the dry middle natural and clear mostly the wide reverb at the sides.</li></ul><p>Keys: <kbd>Space</kbd> play/stop &nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> original/cleaned/removed &nbsp; <kbd>Home</kbd> to start &nbsp; double-click a knob to reset it.</p>',[{t:'Close'}])};
$('#bSet').onclick=function(){openDlg('<h2>Settings</h2><label><input type="checkbox" id="sb"'+(settings.bubbles?' checked':'')+'> Info bubbles</label><label><input type="checkbox" id="sp"'+(settings.power?' checked':'')+'> Power saving (slower display)</label><label>Look <select id="st"><option value="a">A Neon Navy</option><option value="b">B Purple Soda Pop</option><option value="c">C PurrOne</option></select></label>',[{t:'OK',c:'mint',f:function(){settings.bubbles=$('#sb').checked;settings.power=$('#sp').checked;settings.theme=$('#st').value;document.body.dataset.theme=settings.theme;saveSet();draw()}}]);$('#st').value=settings.theme};
$('#bAbout').onclick=function(){openDlg('<h2>About &amp; Support</h2><p><b>Tail Chaser</b> by Studio 87, version 1 design mockup.</p><p>Licence: AGPL-3.0-or-later. Source: github.com/SpeakingColors/TailChaser</p><p>Your own presets live in the plugin\'s Studio 87 / Tail Chaser / presets folder (Windows: %APPDATA%, macOS: Application Support, Linux: XDG data folder).</p><p>Uninstall: use the uninstaller from the download zip. It leaves your presets unless you tell it to delete them.</p><p><a href="https://ko-fi.com/studio87" target="_blank" rel="noopener" style="color:var(--mint)">Support on Ko-fi</a></p>',[{t:'Close'}])};

/* ---------- print ---------- */
function dl(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function wavBlob(L,R,sr){var n=L.length,b=new ArrayBuffer(44+n*8),v=new DataView(b),w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*8,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,3,true);v.setUint16(22,2,true);v.setUint32(24,sr,true);v.setUint32(28,sr*8,true);v.setUint16(32,8,true);v.setUint16(34,32,true);w(36,'data');v.setUint32(40,n*8,true);
 for(var i=0;i<n;i++){v.setFloat32(44+i*8,L[i],true);v.setFloat32(48+i*8,R[i],true)}return new Blob([b],{type:'audio/wav'})}
$('#bPrint').onclick=function(){openDlg('<h2>Print the result</h2><p><b>Write automation (plugin only):</b> the plugin has a Cut parameter that is your host\'s automation lane. Set the track to Write, press Write in the plugin, play once; the cuts are recorded as automation. Then switch the plugin to Read and it follows that lane, so you can edit the curve by hand. This is how fader-riding plugins do it. Not available in this mockup, and not yet tried in Bitwig or Studio One.</p><p><b>Export now:</b></p>',
 [{t:'Cut curve (CSV)',f:function(){var rows=['time_s,'+der.bands.map(function(b,i){return'band'+(i+1)+'_db'}).join(',')],hop=SR*TC.HOP_MS/1000,nh=der.bands[0].gain.length;for(var i=0;i<nh;i+=1){rows.push((i*TC.HOP_MS/1000).toFixed(3)+','+der.bands.map(function(b){return b.gain[i].toFixed(2)}).join(','))}dl('tail-chaser-cuts.csv',new Blob([rows.join('\n')],{type:'text/csv'}));return false}},
 {t:'Cleaned audio (WAV)',c:'mint',f:function(){dl('tail-chaser-cleaned.wav',wavBlob(out.L,out.R,SR));return false}},{t:'Close'}])};

/* ---------- per band amounts in lanes: small row under display ---------- */
function buildAmounts(){var row=$('#amtRow');if(!row){row=document.createElement('div');row.id='amtRow';row.style.cssText='display:flex;gap:10px;margin-top:4px;align-items:center';$('#chips').parentNode.insertBefore(row,$('#chips'))}
 row.style.display=showBands?'flex':'none';row.innerHTML='<span class="chip" style="color:var(--ttl)" data-tip="How much of Depth each band gets. Turn a band down to leave its tails, for example keep the low band natural.">Band amount</span>';
 for(var b=0;b<P.bands;b++){(function(b){var s=document.createElement('label');s.style.cssText='display:flex;align-items:center;gap:4px;font:600 13px Barlow Condensed;color:'+BC[b];s.innerHTML='B'+(b+1)+'<input type="range" min="0" max="100" value="'+P.amount[b]+'" style="width:110px;accent-color:'+BC[b]+'"><span class="chip" style="min-width:48px;text-align:center">'+P.amount[b]+' %</span>';
  var r=$('input',s),v=$('.chip',s);r.oninput=function(){P.amount[b]=+r.value;v.textContent=r.value+' %';soon()};r.ondblclick=function(){r.value=100;r.oninput()};row.appendChild(s)})(b)}}

 var st0=null;d.onpointerdown=function(e){d.setPointerCapture(e.pointerId);st0={x:e.clientX,y:e.clientY,s:scale}};
